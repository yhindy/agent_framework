name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild -w gui

      - name: Run type checking
        run: npm run typecheck -w gui

      - name: Run unit tests
        run: npm test -w gui

  build-and-release:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild -w gui

      - name: Build and package app
        run: npm run package:mac -w gui -- --publish never

      - name: Verify DMG was created
        run: |
          DMG_FILE=$(ls gui/dist/*.dmg | head -1)
          echo "Built: $DMG_FILE"
          ls -lh "$DMG_FILE"
          hdiutil verify "$DMG_FILE"
          echo "DMG verification passed"

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: gui/dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
