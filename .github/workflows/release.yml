name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Run tests on release tag
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild -w gui

      - name: Run type checking
        run: npm run typecheck -w gui

      - name: Run unit tests
        run: npm test -w gui

  build:
    name: Build macOS app (no release)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild -w gui

      - name: Build and package app
        run: npm run package:mac -w gui -- --publish never

      - name: Verify DMG was created
        run: |
          DMG_FILE=$(ls gui/dist/*.dmg | head -1)
          echo "Built: $DMG_FILE"
          ls -lh "$DMG_FILE"
          hdiutil verify "$DMG_FILE"
          echo "DMG verification passed"

      # TODO: Re-enable release once app issues are resolved:
      # - App notarization (currently shows "damaged" warning on macOS)
      # - Black screen on launch
      # To re-enable, uncomment below and add 'permissions: contents: write' to this job
